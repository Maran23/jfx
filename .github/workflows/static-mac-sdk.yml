# Builds a static JavaFX SDK for macOS aarch64 and publishes it as a release asset.
#
# Must be copied into: <graalvm>/Contents/Home/lib/static/darwin-aarch64
#
# Bundle layout (javafx-static-mac-aarch64.zip):
# - static-libs/
#   - libglass.a
#   - libprism_common.a
#   - libprism_es2.a
#   - libprism_mtl.a
#   - libprism_sw.a
#   - libjavafx_font.a
#   - libjavafx_iio.a
#   - libdecora_sse.a
# - BUNDLE-INFO.txt
#
name: Static macOS SDK

on:
  push:
    branches: [ RELEASE ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static_mac_sdk:
    name: Static SDK (macOS aarch64)
    runs-on: "macos-15"
    timeout-minutes: 60

    env:
      BOOT_JDK_VERSION: "25.0.1"
      BOOT_JDK_FILENAME: "jdk-25.0.1_macos-aarch64_bin.tar.gz"
      BOOT_JDK_URL: "https://download.oracle.com/java/25/archive/jdk-25.0.1_macos-aarch64_bin.tar.gz"
      RELEASE_TAG: static-mac-aarch64-latest

    steps:
      - name: Checkout the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download boot JDK
        run: |
          set -eux
          mkdir -p "${HOME}/bootjdk"
          wget -O "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"

      - name: Setup environment
        run: |
          set -eux
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}.jdk/Contents/Home"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME}/bin" >> "${GITHUB_PATH}"
          "${JAVA_HOME}/bin/java" -version
          ant -version
          xcodebuild -version

      - name: Build static SDK
        run: |
          set -eux
          bash gradlew -version
          # Same invocation as the local build. STATIC_BUILD makes mac.gradle emit lib<name>.a
          # instead of lib<name>.dylib; media and WebKit are off by default and must stay off, since
          # build.gradle rejects COMPILE_MEDIA together with STATIC_BUILD.
          # Skip "chmod" task for GHA builds. See JDK-8354337 for details.
          bash gradlew --stacktrace -PCHMOD_ARTIFACTS=false -PSTATIC_BUILD=true -PCONF=Release sdk

      - name: Assemble bundle
        run: |
          set -eux
          mkdir -p dist/static-libs
          cp build/sdk/lib/*.a dist/static-libs/
          # Record the JavaFX version these libs came from: the consuming project takes its JavaFX
          # *jars* from Maven Central, so this is the only place the two versions can be compared.
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "built=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            cat build/sdk/lib/javafx.properties
          } > dist/BUNDLE-INFO.txt

          ls -l dist/static-libs
          # A non-static build produces .dylib files only, so a missing archive means STATIC_BUILD
          # did not take effect.
          for lib in glass prism_common prism_es2 prism_mtl prism_sw javafx_font javafx_iio decora_sse; do
            test -f "dist/static-libs/lib${lib}.a"
          done

          (cd dist && zip -r ../javafx-static-mac-aarch64.zip .)

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javafx-static-mac-aarch64
          path: javafx-static-mac-aarch64.zip
          if-no-files-found: error

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rolling tag: consumers pin to "static-mac-aarch64-latest" and always get the newest build.
          # The delete is expected to fail on the very first run.
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag || true

          gh release create "${RELEASE_TAG}" javafx-static-mac-aarch64.zip \
            --title "Static JavaFX SDK (macOS aarch64)" \
            --notes "STATIC_BUILD (CONF=Release) of \`${GITHUB_SHA}\`"
